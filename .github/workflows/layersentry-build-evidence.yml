name: LayerSentry extract production ISO evidence

on:
  push:
    branches:
      - feat/layersentry-v1.8.2-production
    paths:
      - .github/workflows/layersentry-build-evidence.yml
      - scripts/qualify-production-iso-evidence.sh
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful production ISO workflow run ID
        required: true
        default: "33479776571"
      source_artifact_name:
        description: Production ISO artifact name
        required: true
        default: layersentry-v1.0-harvester-v1.8.2-amd64-offline-iso

permissions:
  actions: read
  contents: read

concurrency:
  group: layersentry-v1.8.2-production-evidence
  cancel-in-progress: false

jobs:
  extract-and-qualify-build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '33479776571' }}
      SOURCE_ARTIFACT_NAME: ${{ github.event.inputs.source_artifact_name || 'layersentry-v1.0-harvester-v1.8.2-amd64-offline-iso' }}
      EXPECTED_SOURCE_COMMIT: a104eab8cc5eca42b7ef002fc96561a21be3f163
      EXPECTED_ARTIFACT_ID: "9790788698"
      EXPECTED_ARTIFACT_SHA256: 905247f635dc45e37f999b4999297a5adef5b0b4b518702879bd0d6767ddcdba
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evidence qualifier
        uses: actions/checkout@v4
        with:
          ref: feat/layersentry-v1.8.2-production
          fetch-depth: 1

      - name: Validate retained artifact identity
        shell: bash
        run: |
          set -euxo pipefail
          artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" --jq '.name')
          artifact_digest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" --jq '.digest')
          artifact_expired=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" --jq '.expired')
          test "$artifact_name" = "$SOURCE_ARTIFACT_NAME"
          test "$artifact_digest" = "sha256:${EXPECTED_ARTIFACT_SHA256}"
          test "$artifact_expired" = "false"

      - name: Download successful production ISO candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: downloaded-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install ISO inspection tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Independently qualify exact production ISO build
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/qualify-production-iso-evidence.sh downloaded-candidate qualified-evidence

      - name: Upload compact auditable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: layersentry-v1.0-harvester-v1.8.2-build-evidence-run-${{ env.SOURCE_RUN_ID }}
          path: qualified-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

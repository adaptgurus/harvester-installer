name: LayerSentry v1.0 provenance gate (Harvester v1.8.2 embedded)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - layersentry-v1.0-dev
  push:
    branches:
      - layersentry-v1.0-dev

permissions:
  contents: read

concurrency:
  group: layersentry-v1.0-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Fast fail-closed provenance validation
    runs-on: [self-hosted, linux, x64, layersentry-provenance-v1]
    timeout-minutes: 10
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable dependency lock and build paths
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/provenance/verify_lock.py \
            provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
            --require-complete \
            --repo-root "$GITHUB_WORKSPACE" \
            --scan-build-inputs \
            --report provenance-gate-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-v1.0-provenance-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance-gate-report.json
          if-no-files-found: error
          retention-days: 90

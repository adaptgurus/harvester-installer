name: LayerSentry v1.8.2 production offline ISO

on:
  push:
    branches:
      - feat/layersentry-v1.8.2-production

permissions:
  contents: read
  actions: write

concurrency:
  group: layersentry-v1.8.2-production-offline-iso
  cancel-in-progress: true

jobs:
  build-production-offline-iso:
    if: contains(github.event.head_commit.message, '[build-iso]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DRONE_TAG: v1.0
      DRONE_BRANCH: feat/layersentry-v1.8.2-production
      DISABLE_BUILD_NET_INSTALL_ISO: "true"
      BUILD_QCOW: "false"
    steps:
      - name: Checkout validated LayerSentry production source
        uses: actions/checkout@v4
        with:
          ref: feat/layersentry-v1.8.2-production
          fetch-depth: 0

      - name: Validate production source and version lock
        shell: bash
        run: |
          set -euxo pipefail

          git merge-base --is-ancestor 49e533b1afbaaa08f0611090a4c09f2a6c6098ed HEAD

          grep -F 'HARVESTER_REF="v1.8.2"' scripts/build
          grep -F 'HARVESTER_COMMIT="5320dfa6770f63406750e7c64b24ed87c543e6ad"' scripts/build
          grep -F 'ADDONS_REF="v1.8.2"' scripts/build
          grep -F 'ADDONS_COMMIT="f60d73d894e00f18d5e11cd21a301ed1b016631c"' scripts/build
          grep -F 'git clone --branch ${HARVESTER_REF} --single-branch --depth 1 https://github.com/harvester/harvester.git ../harvester' scripts/build
          grep -F 'load_and_source_addon ${addons_path} https://github.com/harvester/addons.git ${ADDONS_REF}' scripts/build
          grep -F 'load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8.2' scripts/build-bundle
          grep -F 'git clone --branch v1.8.2 --single-branch --depth 1 https://github.com/harvester/harvester.git ../harvester' scripts/build-bundle
          grep -F 'load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8.2' scripts/package-harvester-os

          grep -F 'RKE2_VERSION="v1.35.7+rke2r1"' scripts/version-rke2
          grep -F 'RANCHER_VERSION="v2.14.3"' scripts/version-rancher

          grep -F 'PRETTY_NAME="LayerSentry 1.0"' scripts/package-harvester-os
          grep -F 'BASE_OS_RELEASE_NAME="Harvester ${HARVESTER_VERSION}"' scripts/package-harvester-os
          grep -F 'DISABLE_BUILD_NET_INSTALL_ISO=true' scripts/package-harvester-os
          grep -F 'if [ "${ARCH}" == "amd64" ] && [ "${DISABLE_BUILD_NET_INSTALL_ISO}" != "true" ]' scripts/package-harvester-os

          python3 - <<'PY'
          from pathlib import Path
          text = Path("pkg/console/install_panels.go").read_text()
          if 'NTPServers: "time.google.com",' not in text:
              raise SystemExit("expected connected-install NTP starting value missing")
          ntp = text[text.index("func addNTPServersPanel"):]
          for marker in (
              "widgets.NewInput(c.Gui, ntpServersPanel",
              "ntpServersV.Value = userInputData.NTPServers",
              "ntpServers, err := ntpServersV.GetData()",
              "userInputData.NTPServers = ntpServers",
          ):
              if marker not in ntp:
                  raise SystemExit(f"editable NTP marker missing: {marker}")
          PY

          bash -n scripts/prepare-production-iso-evidence.sh
          bash -n scripts/qualify-production-iso-evidence.sh

          git rev-parse HEAD
          df -h
          docker system df || true

      - name: Build full offline ISO with native Harvester v1.8.2 pipeline
        shell: bash
        run: |
          set -euxo pipefail
          make default

      - name: Install ISO inspection tooling
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v xorriso >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xorriso
          fi

      - name: Verify exact ISO and prepare immutable evidence
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/prepare-production-iso-evidence.sh dist/artifacts dist/layersentry-production

      - name: Upload compact auditable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: layersentry-v1.0-harvester-v1.8.2-build-evidence
          path: |
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso.sha512
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso.bytes
            dist/layersentry-production/source-commit.txt
            dist/layersentry-production/build-manifest.yaml
            dist/layersentry-production/iso-metadata/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload stable LayerSentry production ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: layersentry-v1.0-harvester-v1.8.2-amd64-offline-iso
          path: |
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso.sha512
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso.bytes
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

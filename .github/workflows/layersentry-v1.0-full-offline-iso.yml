name: LayerSentry v1.0 full-offline ISO (Harvester v1.8.2 embedded)

on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact 40-hex commit on layersentry-v1.0-dev to build
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: layersentry-v1.0-full-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Fast provenance gate
    if: github.ref_name == 'layersentry-v1.0-dev'
    runs-on: [self-hosted, linux, x64, layersentry-provenance-v1]
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind dispatch to explicitly approved source commit
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE_COMMIT"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"

      - name: Validate immutable dependency lock and build paths
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/provenance/verify_lock.py \
            provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
            --require-complete \
            --repo-root "$GITHUB_WORKSPACE" \
            --scan-build-inputs \
            --report provenance-gate-report.json
          python3 scripts/provenance/verify_builder_binding.py \
            --lock provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --report builder-binding-gate-report.json

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-v1.0-prebuild-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provenance-gate-report.json
            builder-binding-gate-report.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build candidate only after provenance pass
    needs: provenance
    runs-on: [self-hosted, linux, x64, layersentry-offline-builder-v1]
    timeout-minutes: 360
    env:
      DRONE_TAG: v1.0
      DRONE_BRANCH: layersentry-v1.0-dev
      DISABLE_BUILD_NET_INSTALL_ISO: "true"
      BUILD_QCOW: "false"
      SOURCE_DATE_EPOCH: "0"
      SYFT_CHECK_FOR_APP_UPDATE: "false"
      LAYERSENTRY_BUILDER_PULL: always
    steps:
      - name: Checkout exact gated source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.provenance.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate gate in build job
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.provenance.outputs.source_commit }}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 scripts/provenance/verify_lock.py \
            provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
            --require-complete \
            --repo-root "$GITHUB_WORKSPACE" \
            --scan-build-inputs \
            --report build-job-provenance-gate-report.json
          python3 scripts/provenance/verify_builder_binding.py \
            --lock provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --report build-job-builder-binding-report.json

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Verify checksum-locked Syft inside immutable builder
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/provenance/run_locked_builder.sh --no-daemon \
            bash -lc '
              set -Eeuo pipefail
              python3 scripts/provenance/verify_staged_syft.py \
                --lock provenance/layersentry-v1.0-harvester-v1.8.2.lock.json \
                --binary "$(command -v syft)" \
                --report prebuild-staged-syft-report.json
            '

      - name: Build native full-offline ISO in immutable builder
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/provenance/run_locked_builder.sh ./scripts/default

      - name: Verify locked builder tooling is present
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/provenance/run_locked_builder.sh --no-daemon \
            bash -lc '
              set -Eeuo pipefail
              for command in \
                docker dockerd python3 git curl wget yq jq helm syft xorriso \
                mksquashfs zstd tar gzip sha256sum sha512sum mcopy mkfs.vfat \
                rsync patch awk sed; do
                command -v "$command"
              done
              go version
              docker --version
              dockerd --version
              docker buildx version
              xorriso -version
              python3 --version
              syft version
            '

      - name: Generate immutable candidate evidence and source SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/provenance/run_locked_builder.sh --no-daemon \
            bash scripts/provenance/prepare-release-evidence.sh \
              dist/artifacts \
              dist/layersentry-production \
              provenance/layersentry-v1.0-harvester-v1.8.2.lock.json

      - name: Upload auditable build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-v1.0-harvester-v1.8.2-evidence-${{ needs.provenance.outputs.source_commit }}
          path: |
            prebuild-staged-syft-report.json
            build-job-provenance-gate-report.json
            build-job-builder-binding-report.json
            dist/layersentry-production/**
            !dist/layersentry-production/*.iso
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload non-promoted ISO candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-v1.0-harvester-v1.8.2-amd64-offline-candidate-${{ needs.provenance.outputs.source_commit }}
          path: |
            dist/layersentry-production/layersentry-v1.0-harvester-v1.8.2-amd64.iso
            dist/layersentry-production/artifact-digests.json
            dist/layersentry-production/resolved-provenance.json
            dist/layersentry-production/source-sbom.spdx.json
            dist/layersentry-production/sbom-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

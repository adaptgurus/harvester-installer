name: LayerSentry implementation gate

on:
  push:
    branches:
      - feat/layersentry-installer-v1.0
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/layersentry-installer-v1.0
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply guarded LayerSentry transformation
        run: |
          # The source variable is askOptionsFunc. Older transform draft had a taskOptionsFunc typo.
          sed -i 's/taskOptionsFunc/askOptionsFunc/g' scripts/layersentry-transform.py
          if grep -q 'askOptionsFunc := interactiveInstallModeOptions' pkg/console/install_panels.go; then
            echo "LayerSentry interactive transformation already applied; skipping"
          else
            python3 scripts/layersentry-transform.py
          fi
      - name: Suppress network HTTP ISO artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/package-harvester-os")
          text = path.read_text()
          marker = "DISABLE_BUILD_NET_INSTALL_ISO=true"
          if marker not in text:
              anchor = 'VERSION_FILE="version.yaml"\n'
              if text.count(anchor) != 1:
                  raise SystemExit("unable to locate VERSION_FILE anchor in scripts/package-harvester-os")
              replacement = anchor + '\n# LayerSentry publishes the full offline ISO only; hide the network/HTTP net-install ISO artifact.\nDISABLE_BUILD_NET_INSTALL_ISO=true\n'
              text = text.replace(anchor, replacement, 1)
              path.write_text(text)
          PY
      - name: Format and validate source
        run: |
          gofmt -w pkg/console/install_panels.go pkg/console/dashboard_panels.go pkg/console/constant.go pkg/console/layersentry.go pkg/console/layersentry_test.go pkg/version/product.go
          git diff --check
          go test ./...
          go build ./...
      - name: Commit validated implementation
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/console/install_panels.go pkg/console/dashboard_panels.go pkg/console/constant.go scripts/package-harvester-os scripts/layersentry-transform.py
          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
            exit 0
          fi
          git commit -m "feat(installer): apply LayerSentry v1.0 interactive workflow"
          git push origin HEAD:feat/layersentry-installer-v1.0

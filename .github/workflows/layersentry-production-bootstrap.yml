name: LayerSentry v1.8.2 production bootstrap

on:
  push:
    branches:
      - feat/layersentry-v1.8.2-production

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned production branch
        uses: actions/checkout@v4
        with:
          ref: feat/layersentry-v1.8.2-production
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin Harvester v1.8.2 build inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-bundle")
          text = path.read_text()

          addon_old = "load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8"
          addon_new = "load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8.2"
          if addon_new not in text:
              if addon_old not in text:
                  raise SystemExit("unable to find Harvester addons v1.8 source marker")
              text = text.replace(addon_old, addon_new, 1)

          harvester_old = "git clone --branch v1.8 --single-branch --depth 1 https://github.com/harvester/harvester.git ../harvester"
          harvester_new = "git clone --branch v1.8.2 --single-branch --depth 1 https://github.com/harvester/harvester.git ../harvester"
          if harvester_new not in text:
              if harvester_old not in text:
                  raise SystemExit("unable to find Harvester v1.8 source marker")
              text = text.replace(harvester_old, harvester_new, 1)

          path.write_text(text)
          PY

      - name: Apply LayerSentry production transformation
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/layersentry-transform.py")
          text = path.read_text()
          text = text.replace(r"\askOptionsFunc", r"\taskOptionsFunc")
          path.write_text(text)
          PY

          if grep -q 'askOptionsFunc := interactiveInstallModeOptions' pkg/console/install_panels.go; then
            echo "LayerSentry core transformation already applied"
          else
            python3 scripts/layersentry-transform.py
          fi

          python3 scripts/layersentry-ui-flow-update.py

      - name: Disable network installer artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/package-harvester-os")
          text = path.read_text()
          marker = "DISABLE_BUILD_NET_INSTALL_ISO=true"
          if marker not in text:
              anchor = 'VERSION_FILE="version.yaml"\n'
              if text.count(anchor) != 1:
                  raise SystemExit("unable to locate VERSION_FILE anchor")
              text = text.replace(
                  anchor,
                  anchor + '\n# LayerSentry releases the full offline ISO only.\nDISABLE_BUILD_NET_INSTALL_ISO=true\n',
                  1,
              )
          path.write_text(text)
          PY

      - name: Validate LayerSentry installer and provenance policy
        shell: bash
        run: |
          set -euxo pipefail

          # User-visible installer policy.
          grep -F 'NTPServers: "time.google.com",' pkg/console/install_panels.go
          grep -F 'VIP (Virtual IP) provides one stable management endpoint for the LayerSentry cluster.' pkg/console/install_panels.go

          # Reproducible Harvester/add-on source pins.
          grep -F 'load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8.2' scripts/build-bundle
          grep -F 'git clone --branch v1.8.2 --single-branch --depth 1 https://github.com/harvester/harvester.git ../harvester' scripts/build-bundle
          grep -F 'load_and_source_addon ${addons_path} https://github.com/harvester/addons.git v1.8.2' scripts/package-harvester-os

          # Product version and upstream base provenance must not be conflated.
          grep -F 'PRETTY_NAME="LayerSentry 1.0"' scripts/package-harvester-os
          grep -F 'BASE_OS_RELEASE_NAME="Harvester ${HARVESTER_VERSION}"' scripts/package-harvester-os
          grep -F 'os: ${BASE_OS_RELEASE_NAME}' scripts/package-harvester-os

          # Guard the native v1.8.2 packaging pipeline from accidental truncation.
          grep -F 'INITRD=$(docker run --rm ${HARVESTER_OS_IMAGE} readlink -f /boot/initrd)' scripts/package-harvester-os
          grep -F 'elemental build-iso --config-dir "${CONFIG_DIR}" --debug "docker:${HARVESTER_OS_IMAGE}"' scripts/package-harvester-os
          grep -F 'sha512sum ${PROJECT_PREFIX}* > $CHECKSUM_FILE' scripts/package-harvester-os
          grep -F 'kind: Version' scripts/package-harvester-os
          grep -F 'harvester-images-list-${ARCH}.txt' scripts/package-harvester-os

          python3 - <<'PY'
          from pathlib import Path

          text = Path("pkg/console/install_panels.go").read_text()

          # NTP remains an editable installer input. The default is a starting
          # value only; the operator can replace it with an approved/local NTP.
          ntp_start = text.index("func addNTPServersPanel")
          ntp_block = text[ntp_start:]
          for marker in (
              "widgets.NewInput(c.Gui, ntpServersPanel",
              "ntpServersV.Value = userInputData.NTPServers",
              "ntpServers, err := ntpServersV.GetData()",
              "userInputData.NTPServers = ntpServers",
          ):
              if marker not in ntp_block:
                  raise SystemExit(f"editable NTP workflow marker missing: {marker}")

          proxy_start = text.index("func addProxyPanel")
          cloud_start = text.index("func addCloudInitPanel")
          proxy_block = text[proxy_start:cloud_start]
          if "showNext(c, sshKeyPanel)" in proxy_block:
              raise SystemExit("SSH screen is still reachable from interactive proxy page")
          if "showNext(c, confirmInstallPanel)" not in proxy_block:
              raise SystemExit("proxy page does not advance directly to confirmation")

          confirm_start = text.index("func addConfirmInstallPanel")
          confirm_end = text.index("func addConfirmUpgradePanel")
          confirm_block = text[confirm_start:confirm_end]
          if "showNext(c, cloudInitPanel)" in confirm_block:
              raise SystemExit("remote config page is still reachable from confirmation")
          if "showNext(c, proxyPanel)" not in confirm_block:
              raise SystemExit("confirmation page does not return to proxy page")
          PY

      - name: Format and validate source
        shell: bash
        run: |
          set -euxo pipefail
          gofmt -w pkg/console/install_panels.go pkg/console/dashboard_panels.go pkg/console/constant.go pkg/console/layersentry.go pkg/console/layersentry_test.go pkg/version/product.go
          git diff --check
          ./scripts/test
          go build ./...

      - name: Commit validated production baseline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pkg/console/install_panels.go \
            pkg/console/dashboard_panels.go \
            pkg/console/constant.go \
            pkg/console/layersentry.go \
            pkg/console/layersentry_test.go \
            pkg/version/product.go \
            scripts/build-bundle \
            scripts/package-harvester-os \
            scripts/layersentry-transform.py \
            scripts/layersentry-ui-flow-update.py

          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
            exit 0
          fi

          git commit -m "feat(installer): apply LayerSentry v1.8.2 production baseline"
          git push origin HEAD:feat/layersentry-v1.8.2-production
